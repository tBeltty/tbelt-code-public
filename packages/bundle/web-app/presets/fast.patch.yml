# Agent preset fast: one `@deepseek-ai/dsh-agent-preset` declaration inserted
# after the web patch. Edits saved from the Web editor override this row's
# `config.plugins` by id from the profile patch.
#
# The rows are `standard`'s with a short persona and without the repository map,
# clock, schedule, goal, and search-replace rows. The tools of the `tool-groups`
# row stay out of every request until the model calls `enable_tools`, so a first
# request carries the core file and shell tools plus one small enable tool.
- insert:
    - id: preset-fast
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: fast
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are a coding agent powered by the {{model}} model. Make small precise edits
                and keep replies short with clear file paths.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: memory-recall
            name: '@deepseek-ai/dsh-memory-recall'
          - id: tool-remember
            name: '@deepseek-ai/dsh-tool-remember'
          - id: tool-recall-memory
            name: '@deepseek-ai/dsh-tool-recall-memory'
          - id: command-remember
            name: '@deepseek-ai/dsh-command-remember'
          - id: command-undo
            name: '@deepseek-ai/dsh-command-undo'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          # `agentsHome` is pinned under this product's own `.dsh` directory rather
          # than the package's shared-across-agent-tools `~/.agents` default: an
          # operator's personal skills authored for a different agent CLI must not
          # surface in this product's own skill picker. `DSH_AGENTS_HOME` still
          # overrides, for an operator who deliberately wants that sharing.
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              agentsHome: !!js process.env.DSH_AGENTS_HOME ?? `${process.env.HOME ?? process.env.USERPROFILE}/.dsh/agents`
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: command-clear
                name: '@deepseek-ai/dsh-command-clear'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          # Subagent tools stay on the default model here: `modelSelectionSettings`
          # registers the tool in each agent's own scope, and `tool-groups` hides
          # tools through `tools.restrict()`, which never masks an agent's own scope.
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              # Three named delegation roles over the same spawn backend, each with its
              # own Agent Preset (packages/preset/agent-preset/presets/roles): Inspector
              # cannot write or run shell commands and cannot delegate further; Coder is
              # the unrestricted implementation role; Tester keeps the full toolset but
              # runs one-shot with a depth of one.
              - id: tool-subagent-inspector
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent_inspector
                  agentPreset: inspector
                  backgroundMode: continuable
                  maxDepth: 0
              - id: tool-subagent-coder
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent_coder
                  agentPreset: coder
                  backgroundMode: continuable
              - id: tool-subagent-tester
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent_tester
                  agentPreset: tester
                  backgroundMode: one-shot
                  maxDepth: 1
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-groups
            name: '@deepseek-ai/dsh-tool-groups'
            config:
              groups:
                - name: search
                  description: Find files by name pattern and search file contents.
                  tools: [glob, grep]
                - name: web
                  description: Search the web and fetch pages.
                  tools: [web_search, web_fetch]
                - name: tasks
                  description: Keep a task list and ask the user a question.
                  tools: [todo_write, ask_user_question]
                - name: background
                  description: List, read, and stop background commands.
                  tools: [job_list, job_output, job_kill]
                - name: agents
                  description: Delegate work to subagents and message them.
                  tools: [subagent, subagent_fork, subagent_inspector, subagent_coder, subagent_tester, list_agents, send_message, interrupt_agent]
                - name: workflow
                  description: Run a scripted multi-agent workflow.
                  tools: [workflow]
                - name: memory
                  description: Save and recall facts across sessions.
                  tools: [remember_fact, recall_memory]
                - name: present
                  description: Show a file, page, or preview to the user.
                  tools: [present, preview]
