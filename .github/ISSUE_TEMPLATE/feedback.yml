name: Feedback or idea
description: A suggestion, a rough edge or something that confused you.
body:
  - type: textarea
    id: feedback
    attributes:
      label: What would you change
      description: What you were trying to do and where the app got in the way.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: tBelt Code version
      description: Shown in the About tBelt Code window.
