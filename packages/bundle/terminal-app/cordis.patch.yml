# The dsh-terminal-app bundle patch: the terminal client over the web bundle's Host.
# It is applied after dsh-base and dsh-web-app. The web layer's Host rows (Session,
# Workspace, Job, Settings and Account controllers, presets, Connection, Remote
# events, file upload) stay, so the terminal speaks the same Remote API as the
# browser. This layer turns off what only a browser needs: the web server and its
# start-up flags, the client bundle server, hot reload, and every `ui-*` row.
# Product analytics and the telemetry exporter ship disabled in the web layer and
# are not touched here; the terminal profile mounts neither.
#
# The Connection row keeps its Host half (the Remote API handler) and drops the
# web-runtime injection that only fed its browser trust fence.

# ── rows that exist only to serve a browser ─────────────────────────────────

- id: web-startup
  disabled: true

- id: webserver
  disabled: true

- id: web-runtime
  disabled: true

- id: client-hmr
  disabled: true

- id: modules
  disabled: true

- id: cordis-client-runner
  disabled: true

- id: open-in-app
  disabled: true

# Opens a native or in-page folder picker for the browser; it waits for the web server.
- id: directory-picker
  disabled: true

- id: ui-open-in-app
  disabled: true

- id: ui-settings-account
  disabled: true

- id: ui-theme
  disabled: true

