- id: connection
  inject: []
  config: {}

# ── the terminal client ──────────────────────────────────────────────────────

- insert:
    - id: terminal-startup
      name: '@deepseek-ai/dsh-terminal-app'

    # Reads its start-up choice from the ordinary terminalStartup provider and runs
    # once the tree is up.
    - id: terminal-client
      name: '@deepseek-ai/dsh-terminal-client'
      inject: [terminalStartup]
      config:
        resume: !!js ctx.terminalStartup.resume
        continueLatest: !!js ctx.terminalStartup.continueLatest
        cwd: !!js ctx.terminalStartup.cwd
