name: Bug report
description: Something in tBelt Code does not work as expected.
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what you got. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a workspace
        2. Send "..."
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: tBelt Code version
      description: Shown in the About tBelt Code window.
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: System
      options:
        - Windows 10 or 11
        - macOS on Apple silicon
        - Linux
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Model provider and model
      description: For example OpenRouter with a named model, or Ollama running locally.
  - type: textarea
    id: logs
    attributes:
      label: Error text or logs
      description: Remove API keys and anything private before pasting.
      render: text
