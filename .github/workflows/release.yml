# Creates the GitHub Release for a version tag, with that version's
# CHANGELOG.md section as its notes. Versions with a pre-release suffix
# (for example 0.2.0-rc.2.20261002) are marked as pre-releases.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          scripts/release-notes.sh notes "$version" > "$RUNNER_TEMP/notes.md"
          printf '\nDownload tBelt Code from https://tbelt.online.\n' >> "$RUNNER_TEMP/notes.md"
          prerelease=()
          [[ "$version" == *-* ]] && prerelease=(--prerelease)
          gh release create "$TAG" --verify-tag --title "tBelt Code $version" \
            --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"
